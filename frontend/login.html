<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — RentEase</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<main class="auth-wrap">
  <div class="card auth-card">
    <h1 style="font-size:1.6rem">Welcome back</h1>
    <p class="muted" style="margin-top:0">Log in to manage listings or contact owners.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit">Log in</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:1rem">New to RentEase? <a href="register.html">Create an account</a></p>
    <div class="demo-box">
      <strong>Demo accounts</strong> (password <code>Password123!</code>, available after seeding):<br>
      <button class="btn secondary small" type="button" data-demo="ahmed.owner@rentease.pk">Owner</button>
      <button class="btn secondary small" type="button" data-demo="ayesha.tenant@rentease.pk">Tenant</button>
      <button class="btn secondary small" type="button" data-demo="admin@rentease.pk">Admin</button>
    </div>
  </div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
